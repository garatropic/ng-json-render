name: Release

# Publishing a GitHub Release publishes both packages to npm via npm Trusted Publishing (OIDC) with
# provenance — no npm token. The release itself is created locally by `pnpm release` (nx release),
# which versions, updates CHANGELOG.md, commits, tags, pushes and creates the GitHub Release.

on:
  release:
    types: [published]
  workflow_dispatch: # manual re-run

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  # Gate: run the same checks as CI on the released commit before publishing.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # No `registry-url` on purpose: it writes an empty _authToken line that defeats OIDC.
          node-version: 24
          cache: 'pnpm'

      # Trusted publishing needs npm >= 11.5.1. Pin 11: npm 12 may require a newer Node than the runner's.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile

      # ng-packagr writes the publishable packages to dist/libs/*.
      - run: pnpm exec nx run-many -t build -p core primitives

      # Core first (primitives peer-depends on it). Prereleases (e.g. 1.0.0-beta.0) go to the `next`
      # dist-tag, everything else to `latest`. Already-published versions are skipped, so a re-run
      # after a partial failure is safe.
      - name: Publish to npm
        run: |
          set -euo pipefail
          for lib in core primitives; do
            dir="dist/libs/$lib"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on npm)"; continue
            fi
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            echo "publish $name@$version --tag $tag"
            npm publish "$dir" --access public --provenance --tag "$tag"
          done
